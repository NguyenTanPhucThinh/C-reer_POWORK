services:
  # 1. Dịch vụ Cơ sở dữ liệu PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: powork_db
    restart: unless-stopped
    ports:
      - "5432:5432" # Mở cổng 5432 ra ngoài máy host nếu cần kết nối trực tiếp (ví dụ qua DBeaver/PgAdmin)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-powork_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-powork_pass}
      POSTGRES_DB: ${POSTGRES_DB:-powork_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-powork_user} -d ${POSTGRES_DB:-powork_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Dịch vụ Backend API
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: powork_backend
    restart: unless-stopped
    ports:
      - "3001:3001" # Host port 3001 trỏ về container port 3001
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3001}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      # Google OAuth is enabled only when these values are provided.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3001/api/v1/auth/google/callback}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-15000}
      # Sử dụng tên dịch vụ 'postgres' thay vì 'localhost' để kết nối nội bộ giữa các container
      DATABASE_URL: ${DATABASE_URL:-postgresql://powork_user:powork_pass@postgres:5432/powork_db}
      JWT_SECRET: ${JWT_SECRET:-powork_super_secret_dev_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-admin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-powork-submissions}
      MINIO_PRESIGNED_EXPIRY: ${MINIO_PRESIGNED_EXPIRY:-300}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-POWORK <no-reply@powork.vn>}
    command: sh -c "npx prisma migrate deploy && npm start"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3001/health'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy # Chỉ chạy Backend khi PostgreSQL đã hoàn toàn sẵn sàng
      minio:
        condition: service_started
      clamav:
        condition: service_healthy

  # 3. Dịch vụ Frontend Next.js
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        # Public URL that the browser can reach directly.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        # Internal URL used by server-side rendering inside Docker.
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:3001}
    container_name: powork_frontend
    restart: unless-stopped
    ports:
      - "3000:3000" # Host port 3000 trỏ về container port 3000
    environment:
      NODE_ENV: production
      # Public browser-facing URL.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      # Internal Docker URL for server-side calls.
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:3001}
    depends_on:
      backend:
        condition: service_healthy

  # 4. Dịch vụ MinIO (Object Storage)
  minio:
    image: minio/minio
    platform: linux/amd64
    container_name: powork_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-admin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  clamav:
    image: clamav/clamav
    container_name: powork_clamav
    restart: unless-stopped
    ports:
      - "3310:3310"

volumes:
  postgres_data:
  minio_data:
